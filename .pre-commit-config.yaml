# GodotAP for Godot 3.6 pre-commit hooks
#
# Hooks to only run on branches starting with "downpatch-3.6.0"  
# Each custom hook has its own branch params and logic.

repos:
  - repo: local
    hooks:
      - id: relativize-ext-resources
        name: Relativize paths (Godot 3.6)
        description: Relativize godot_ap ext_resource paths (Godot 3.6).
        entry: pwsh -NoProfile -File hooks/pre-commit-relativize.ps1 -BranchRegex '^downpatch-3\.6\.0'
        language: system
        types: [text]
        files: ^godot_ap/.*\.(tscn|tres)$

  # GDScript linter and formatter
  - repo: https://github.com/Scony/godot-gdscript-toolkit
    rev: 3.6.0
    hooks:
      - id: gdlint
        alias: gdlint-36
        name: gdlint (Godot 3.6)
        description: Lint GDScript files (Godot 3.6).
        entry: pwsh -NoProfile -File hooks/pre-commit-gdtoolkit.ps1 -Tool gdlint -BranchRegex '^downpatch-3\.6\.0'
        additional_dependencies: [setuptools<81]   # pkg_resources removed in v81+
        files: \.gd$
      - id: gdformat
        alias: gdformat-36
        name: gdformat (Godot 3.6)
        description: Format GDScript files (Godot 3.6).
        entry: pwsh -NoProfile -File hooks/pre-commit-gdtoolkit.ps1 -Tool gdformat -BranchRegex '^downpatch-3\.6\.0'
        additional_dependencies: [setuptools<81]   # pkg_resources removed in v81+
        files: \.gd$
